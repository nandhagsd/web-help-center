<div #imageContainer class="relative w-full overflow-hidden border rounded-2xl"
     [style.aspect-ratio]="ratioString()">
  <img [src]="imageSrc()"
       alt="Image Preview"
       class="absolute top-0 left-0 max-w-none select-none"
       [style.width.px]="imgDrawWidth()!"
       [style.height.px]="imgDrawHeight()!"
       [style.transform]="transform()">
</div>
